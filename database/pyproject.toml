[project]
name = "database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Barthakur, Uttam kumar", email = "Uttamkumar.Barthakur@carelon.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pymongo[srv]>=4.18.1",
